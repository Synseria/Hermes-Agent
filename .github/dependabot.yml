version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
    # Attendre 7 jours après publication amont avant de proposer le bump :
    # laisse le temps à une version compromise ou cassée d'être retirée.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Node : uniquement les LTS (versions paires). Le bump auto vers node 26
      # (impair, non-LTS) a fait pendre les builds pendant 13 jours (cf. Dockerfile).
      - dependency-name: "node"
        versions: ["25.x", "27.x", "29.x", "31.x"]
