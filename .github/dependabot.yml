version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
    # Attendre 7 jours après publication amont avant de proposer le bump :
    # laisse le temps à une version compromise ou cassée d'être retirée.
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "github-actions"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "daily"
      time: "12:00"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "docker"
    ignore:
      # Node : jamais de bump de majeure automatique. Le bump auto vers node 26
      # a fait pendre les builds pendant 13 jours, et la syntaxe `versions:`
      # ne matche pas les tags Docker (25-trixie-slim) — d'où update-types.
      # Les montées de majeure node se font à la main, LTS uniquement.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
